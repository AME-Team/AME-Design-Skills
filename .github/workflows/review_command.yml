---
# PR コメントで ``/request-review`` (エイリアス ``/review``) を投稿するとレビューを開始する。
# 明示的なコマンドでのみ動作する。
# workflow_dispatch はブートストラップ・再実行用途（PR 番号を入力して手動起動）。
#
# トリガー: issue_comment (PR 上のコメントで発火)。Issue コメントでは発火しないよう
# github.event.issue.pull_request != null でフィルタする。

name: AI Code Review (Command)

"on":
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "レビュー対象 PR 番号（手動実行時）"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  general-review-command:
    name: Review on /request-review (ame-ai-reviewer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request != null &&
       github.event.comment.user.login != 'ame-ai-reviewer[bot]' &&
       startsWith(github.event.comment.body, '/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore engine credentials
        run: |
          mkdir -p ~/.local/share/opencode ~/.gemini/antigravity-cli
          echo "${{ secrets.OPENCODE_AUTH_B64 }}" | base64 -d > ~/.local/share/opencode/auth.json
          AGY_TOKEN=~/.gemini/antigravity-cli/antigravity-oauth-token
          echo "${{ secrets.ANTIGRAVITY_OAUTH_B64 }}" | base64 -d > "$AGY_TOKEN"
          echo "${{ secrets.GEMINI_OAUTH_B64 }}" | base64 -d > ~/.gemini/oauth_creds.json
          chmod 600 ~/.local/share/opencode/auth.json "$AGY_TOKEN" ~/.gemini/oauth_creds.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python engine SDKs
        # REVIEW_ENGINE が opencode (既定) の場合は不要。claude / antigravity 時のみ導入する。
        # エンジン解決は vars/secrets フォールバック (既定 opencode) で、下の review ステップと同一。
        # 導入方法はエンジン欠落時のエラーメッセージと同じ uv コマンドに統一している。
        env:
          REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || secrets.REVIEW_ENGINE || 'opencode' }}
        run: |
          if [ "$REVIEW_ENGINE" = "opencode" ]; then
            echo "Engine is opencode; Python SDKs not required."
            exit 0
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system --python "$(command -v python3)" \
            claude-agent-sdk google-antigravity
      - name: Install OpenCode CLI
        run: npm install -g opencode-ai
      - name: Install TS engine deps (vendored sidecar)
        # ame_ai_review_system/ をトップレベルに vendored する運用 (ディレクトリコピー)
        # を想定。本ファイルも含めて .github/ と ame_ai_review_system/ をコピーすれば
        # 導入先でも同じパスで動作する。
        run: npm --prefix ame_ai_review_system/engines/ts install
      - name: Determine target PR and whether to run
        id: cmd
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_PR: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${INPUT_PR}" >> "$GITHUB_OUTPUT"
          else
            RUN_REVIEW=$(python3 -m ame_ai_review_system.review_config \
              is-review-command "${COMMENT_BODY}")
            echo "run_review=${RUN_REVIEW}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${ISSUE_PR}" >> "$GITHUB_OUTPUT"
          fi
      - name: Get GitHub App installation token
        id: app_token
        if: steps.cmd.outputs.run_review == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AME_AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AME_AI_REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - name: Switch to PR branch
        if: steps.cmd.outputs.run_review == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cmd.outputs.pr_number }}
          GITHUB_PAT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          python3 -m ame_ai_review_system.main checkout "$PR_NUMBER"
      - name: Start OpenCode server
        if: steps.cmd.outputs.run_review == 'true'
        run: |
          opencode serve --port 4096 > /tmp/opencode-server.log 2>&1 &
          echo $! > /tmp/opencode.pid
          for _ in $(seq 1 30); do
            if grep -q "opencode server listening" /tmp/opencode-server.log 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "OPENCODE_URL=http://127.0.0.1:4096" >> "$GITHUB_ENV"
      - name: Run General Review
        if: steps.cmd.outputs.run_review == 'true'
        # プロンプトは --prompt-file で明示せず paths.prompt_path() の既定解決に任せる。
        # .ame-review/ が無い導入先 (コピー運用) では同梱の
        # ame_ai_review_system/review_prompt.txt へフォールバックする (paths.py)。
        env:
          AME_AI_REVIEWER_TOKEN: ${{ steps.app_token.outputs.token }}
          REVIEWER_NAME: ame-ai-reviewer
          PR_NUMBER: ${{ steps.cmd.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Issue #40: エンジン情報の表示/非表示は GitHub Variables / Secrets で制御する。
          # Variables に登録 → 実値がログへ表示 / Secrets に登録 → *** でマスク。
          # REVIEW_ENGINE は未登録時の後方互換フォールバックを保持 (従来の既定 opencode)。
          REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || secrets.REVIEW_ENGINE || 'opencode' }}
          OPENCODE_URL: ${{ env.OPENCODE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || secrets.REVIEW_MODEL }}
          REPLY_MODEL: ${{ vars.REPLY_MODEL || secrets.REPLY_MODEL }}
          REVIEW_THINKING: ${{ vars.REVIEW_THINKING || secrets.REVIEW_THINKING }}
        run: |
          python3 -m ame_ai_review_system.main review \
            "$PR_NUMBER"
      - name: Stop OpenCode server
        if: always() && steps.cmd.outputs.run_review == 'true'
        run: |
          if [ -f /tmp/opencode.pid ]; then
            pid=$(cat /tmp/opencode.pid)
            echo "$pid" | xargs -r kill -15
          fi
