# pre-commit フック定義（AME-Design-Skills / Markdown 運用向け）
#
# 方針: 本リポジトリは Markdown（Skill 集）・設定ファイル・YAML・シェルが中心で
#       Python/TypeScript/SQL のプロジェクトコードを持たない。そのためコード向け
#       フック（ruff/mypy/pyright/eslint/tsc/stylelint/sqlfluff/semgrep/pytest/vitest）
#       を除外し、Markdown/設定/シェル/セキュリティ/Git衛生の静的解析に特化する。
#
#   - 標準ツールは pre-commit のミラーリポジトリから取得（インストール負荷最小）。
#   - npm 系（markdownlint-cli2 / textlint / prettier / commitlint）はルートの
#     `package.json` から `npm ci` で導入し `./node_modules/.bin/*` を直接呼ぶ。
#   - ローカル静的解析スクリプトは `scripts/` 配下を使用。
#
# ── 初回セットアップ ──────────────────────────────────────────────────────────
#   # システムツール
#   curl -LsSf https://astral.sh/uv/install.sh | sh
#   uv tool install pre-commit
#   sudo apt update && sudo apt install -y shellcheck gitleaks codespell yamllint
#   # actionlint はバイナリを取得（setup.md 参照）
#   # npm 依存（markdownlint-cli2 / textlint / prettier / commitlint）
#   npm ci
#   # フック登録
#   pre-commit install --install-hooks -t pre-commit -t commit-msg
#
# ── 全ファイルに手動でかける ────────────────────────────────────────────────
#   pre-commit run --all-files
---
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: true # 1フック失敗で後続フックを即停止。

# 依存ディレクトリ・ロックファイルは静的解析対象外。
exclude: |
  (?x)^(
      (^|/)node_modules/.*|
      (^|/)\.venv/.*|
      (^|/)\.git/.*|
      (^|/)dist/.*|
      (^|/)build/.*|
      .*\.lock$|
      package-lock\.json
  )$

repos:
  # =========================================================================
  # 1) 汎用ファイル衛生チェック（pre-commit-hooks）
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$ # Markdown の意味のある行末空白を保持
      - id: end-of-file-fixer
        exclude: \.md$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules

  # =========================================================================
  # 2) 綴りミス検出（コード・コメント・ドキュメント横断）
  # =========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  # =========================================================================
  # 3) シークレットスキャン
  # =========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks
        entry: gitleaks protect --staged

  # =========================================================================
  # 4) YAML lint（strict）。設定は .yamllint.yaml
  # =========================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  # =========================================================================
  # 5) シェルスクリプト静的解析。設定は .shellcheckrc
  # =========================================================================
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # =========================================================================
  # 6) GitHub Actions ワークフロー構文検証
  # =========================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # =========================================================================
  # 7) ローカルフック（npm 系 Markdown/フォーマット + 構文チェック）
  # =========================================================================
  - repo: local
    hooks:
      # --- Markdown lint（自動修正可能なものは --fix で直す）。設定は .markdownlint-cli2.jsonc
      - id: markdownlint-cli2
        name: markdownlint-cli2 (Markdown)
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
        pass_filenames: false
        require_serial: true

      # --- Mermaid 記法チェック（scripts/ 配下のバリデータ）
      - id: mermaid-check
        name: mermaid syntax check
        entry: python3 scripts/mermaid_check.py
        language: system
        types: [markdown]
        pass_filenames: true
        require_serial: true

      # --- textlint（日本語散文品質）。設定は .textlintrc
      - id: textlint
        name: textlint (Japanese prose)
        entry: ./node_modules/.bin/textlint
        language: system
        types: [markdown]
        pass_filenames: true
        require_serial: true

      # --- Prettier（MD/YAML/JSON フォーマット）。設定は .prettierrc / .prettierignore
      - id: prettier
        name: prettier (MD/YAML/JSON)
        entry: ./node_modules/.bin/prettier --check
        language: system
        types_or: [markdown, yaml, json]
        pass_filenames: true

      # --- Conventional Commits 強制。設定は .commitlintrc.json
      - id: commitlint
        name: commitlint (Conventional Commits enforcement)
        entry: ./node_modules/.bin/commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
