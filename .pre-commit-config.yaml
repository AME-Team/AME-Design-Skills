---
# AME AI Review System — pre-commit profile: text
# ドキュメント/文章の静的解析 (codespell / markdownlint / textlint) + AI レビューフック。
# 本リポジトリ向け拡張: セキュリティ (gitleaks) / 設定品質 (yamllint/shellcheck/actionlint) /
# Git衛生 (pre-commit-hooks) を統合復元している。
#
# 削除した既存フックと理由（AME-AI-Review-System 導入時、init 生成物へ置き換え）:
#   - commitlint / prettier: pre-commit フックとしては廃止。package.json に定義済みの
#     npm run commitlint / npm run format を手動実行のみ提供する。
#     コミットメッセージの自動強制は行わず、品質は PR レビュー (Gate 2) で確認する。
#   - mermaid-check: 図表構文検証。スクリプト scripts/mermaid_check.py は維持しており、
#     必要に応じ local フックとして再登録可能。
#
# markdownlint-cli2 / textlint はルート `package.json` の npm 依存
# (`./node_modules/.bin/*`) を直接呼ぶ。`ame-ai-reviewer init` 生成のリポジトリ参照
# (markdownlint-cli の markdownlint-cli2 / textlint の textlint) はマニフェスト不備のため
# 使用しない。
#
# ── 初回セットアップ ──────────────────────────
#   # LLM エンジンとレビューコア（.venv に導入）
#   uv venv .venv --python 3.12
#   source .venv/bin/activate
#   uv pip install <AME-AI-Review-System wheel v0.2.5>（URL は setup.md 参照）
#   # .ame-review/（config.json / review_prompt.txt）は v0.2.4 と v0.2.5 で内容変更なし。
#   # .venv は .gitignore 対象のため版数同期はローカルで実施する（Gate 1 が参照）。
#   # npm 依存（markdownlint-cli2 / textlint / prettier / commitlint）
#   npm ci
#   # フック登録（post-commit は Gate 1 AI レビューの streak リセットに必須）
#   pre-commit install --install-hooks -t pre-commit -t post-commit
#
# ── 全ファイルに手動でかける ──────────────────
#   SKIP=ai-precommit-review pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, post-commit]
fail_fast: true # 1フック失敗で後続フックを即停止。

# 依存ディレクトリ・ロックファイルは静的解析対象外。
exclude: |
  (?x)^(
      (^|/)node_modules/.*|
      (^|/)\.venv/.*|
      (^|/)\.git/.*|
      (^|/)dist/.*|
      (^|/)build/.*|
      .*\.lock$|
      (^|.*/)package-lock\.json$
  )$

repos:
  # =========================================================================
  # 1) 汎用ファイル衛生チェック（pre-commit-hooks）
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$ # Markdown の意味のある行末空白を保持
      - id: end-of-file-fixer
        exclude: \.md$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules

  # =========================================================================
  # 2) 綴りミス検出（コード・コメント・ドキュメント横断）
  # =========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        exclude: (^|.*/)package-lock\.json$

  # =========================================================================
  # 3) シークレットスキャン
  # =========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks
        entry: gitleaks protect --staged

  # =========================================================================
  # 4) YAML lint（strict）。設定は .yamllint.yaml
  # =========================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  # =========================================================================
  # 5) シェルスクリプト静的解析。設定は .shellcheckrc
  #    (shellcheck-precommit のデフォルトは docker_image のため、システムの
  #     shellcheck バイナリを直接使うよう上書きする)
  # =========================================================================
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        language: system
        entry: shellcheck

  # =========================================================================
  # 6) GitHub Actions ワークフロー構文検証
  # =========================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # =========================================================================
  # 7) ローカルフック（npm 系 Markdown lint + textlint + AI レビュー）
  # =========================================================================
  - repo: local
    hooks:
      # --- Markdown lint（自動修正）。設定は .markdownlint-cli2.jsonc
      - id: markdownlint-cli2
        name: markdownlint-cli2 (Markdown)
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
        pass_filenames: false
        require_serial: true

      # --- textlint（日本語散文品質、自動修正）。設定は .textlintrc
      #     ja-no-mixed-period（文末句点の統一・検出）は .textlintrc で無効化。
      #     コードブロック導入のラベル行など、句点で終わらない表記を許容するため。
      - id: textlint
        name: textlint (Japanese prose)
        entry: ./node_modules/.bin/textlint --fix
        language: system
        types: [markdown]
        pass_filenames: true
        require_serial: true

      # --- AI review skip guard (Issue #26)
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: python -m ame_ai_review_system.skip_guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --- AI Code Review (pre-commit) — Gate 1
      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: ./scripts/precommit-review.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --- AI review state reset (post-commit)
      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: python -m ame_ai_review_system.post_commit_reset
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
