---
# Semgrep カスタムルール — AME-AI-Review-System プロジェクト固有ルール
#
# CLAUDE.md §8 のコーディング規約を機械的に強制する。
# 過去の AI レビュー指摘（126件中47件）のうち、静的解析で検出可能な
# パターンをルール化している。
#
# 実行: semgrep --config ame-ai-review-system/.semgrep/rules.yml --error

rules:
  # =========================================================================
  # 1. except Exception / except BaseException 禁止 (CLAUDE.md §8)
  #    過去指摘: PR5, PR8 (2件)。具体的な例外型に限定すること。
  # =========================================================================
  - id: ame-no-broad-exception
    languages: [python]
    severity: ERROR
    message: "except Exception は禁止。具体的な例外型に限定すること (CLAUDE.md §8)"
    pattern-regex: 'except\s+(Exception|BaseException)\s*(?:as\s+\w+)?\s*:'

  # =========================================================================
  # 2. シェルスクリプト内インライン Python の except Exception 禁止
  #    bash モードではインライン Python を解析できないため generic で走査。
  # =========================================================================
  - id: ame-no-broad-exception-inline
    languages: [generic]
    severity: ERROR
    message: "except Exception は禁止。具体的な例外型に限定すること (CLAUDE.md §8)"
    paths:
      include:
        - "*.sh"
    pattern-regex: 'except\s+(Exception|BaseException)\s*:'

  # =========================================================================
  # 3. kill -15 $pids 直接呼出禁止 (CLAUDE.md §8)
  #    変数展開で複数 PID を渡す場合は echo "$pids" | xargs -r kill -15 を使う。
  # =========================================================================
  - id: ame-no-direct-kill
    languages: [generic]
    severity: ERROR
    message: 'kill -15 $pids は禁止。echo "$pids" | xargs -r kill -15 を使うこと (CLAUDE.md §8)'
    paths:
      include:
        - "*.sh"
    pattern-regex: 'kill\s+(-15|-TERM)\s+["'']?\$[A-Za-z_]'

  # =========================================================================
  # 4. echo "$X" | python3 -c 禁止 (CLAUDE.md §8)
  #    引数展開によるインジェクションを避けるため printf '%s\n' を使う。
  # =========================================================================
  - id: ame-no-echo-pipe-python
    languages: [generic]
    severity: WARNING
    message: "echo | python3 -c はインジェクションリスク。printf '%s\\n' を使うこと (CLAUDE.md §8)"
    paths:
      include:
        - "*.sh"
    patterns:
      - pattern-regex: 'echo\s+["'']?[$"]?.*\|\s*python3?\s+-c'
      - pattern-not-regex: '\$\('

  # =========================================================================
  # 5. sys.argv[N] で外部 JSON を json.loads に渡す (インジェクション/ARG_MAX)
  #    過去指摘: PR5 (2件)。stdin 渡しを推奨。
  # =========================================================================
  - id: ame-no-sysargv-json
    languages: [python]
    severity: WARNING
    message:
      "sys.argv で外部 JSON を渡すのは ARG_MAX/インジェクションリスク。stdin 渡しを推奨 (CLAUDE.md
      §8)"
    pattern: json.loads(sys.argv[$N])

  # =========================================================================
  # 6. --dangerously-skip-permissions が非 claude 分岐に混入
  #    過去指摘: PR10 (4件)。claude エンジン専用フラグの漏出を検出。
  # =========================================================================
  - id: ame-claude-flag-leak
    languages: [python]
    severity: ERROR
    message:
      "--dangerously-skip-permissions は claude エンジン専用。非 claude 分岐の args
      に混入させていないか確認"
    paths:
      exclude:
        - "**/tests/*"
    patterns:
      - pattern: '"--dangerously-skip-permissions"'
      - pattern-not-inside: |
          if $ENGINE == "claude":
            ...

  # =========================================================================
  # 7. 曖昧なUnicode文字（ゼロ幅文字・Bidi上書き文字）禁止 (Issue #13)
  #    Python ファイルは Ruff RUF001/002/003 がカバーするため除外。
  #    ゼロ幅文字や Bidi 制御文字は見えないため、悪意あるコード注入に悪用される。
  # =========================================================================
  - id: ame-no-ambiguous-unicode
    languages: [generic]
    severity: WARNING
    message:
      "曖昧なUnicode文字（ゼロ幅文字・Bidi上書き文字）の使用を禁止。類似文字によるコード偽装を防ぐため
      (Issue #13)。"
    paths:
      exclude:
        - "**/*.py"
        - "**/*.pyi"
        - "**/*.lock"
        - "**/*.min.js"
        - "**/*.min.css"
        - "**/*.zip"
        - "**/*.db"
        - "**/*.wasm"
        - "**/*.sha512"
        - "**/ame_ai_review_system/.semgrep/**"
    pattern-regex: "[​-‏﻿‪-‮⁦-⁩]"

  # =========================================================================
  # 8. SKIP=ai-precommit-review による Gate1 AI レビューのバイパス禁止 (Issue #26)
  #    AI Agent がシェルスクリプト内で SKIP を使ってコミットを迂回するのを検出する。
  #    正当なバイパスは skip_guard.py が sudo/トークンで管理するため、スクリプト内の
  #    SKIP 使用は原則として禁止。docs と設定ファイル・ツール自体は除外する。
  #    注意: semgrep の paths グロブは gitignore 準拠で `*` は `/` を跨がないため、
  #    サブディレクトリの .sh も拾うには `**/*.sh` とする必要がある。
  # =========================================================================
  - id: ame-no-skip-ai-review
    languages: [generic]
    severity: ERROR
    message:
      "SKIP=ai-precommit-review による Gate1 AI レビューのバイパスは禁止 (Issue #26)。
      スキップせずコードを修正して再コミットすること。"
    paths:
      include:
        - "**/*.sh"
      exclude:
        - "**/ame_ai_review_system/.semgrep/**"
        - "**/docs/**"
        - "**/scripts/install*"
    pattern-regex: '(SKIP|skip)[=\s]+["'']?[^"'']*\b(ai-precommit-review|ai-skip-guard)\b'
