---
# AME AI Review System — pre-commit profile: full
# Python + Node + Shell + 設定ファイル + Secret + AI レビューの包括セット。
# (各フックの実行には対応ツールのインストールが必要。不要なフックは削除してよい)
minimum_pre_commit_version: "4.0.0"
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: python -m ame_ai_review_system.skip_guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: python -m ame_ai_review_system.precommit_review
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: python -m ame_ai_review_system.post_commit_reset
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
