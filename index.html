<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AME Design Skills | UI/UX Guidelines & Interactive Demonstration</title>
    <meta
      name="description"
      content="TypeScript + Tailwind CSS 用の汎用 UI/UX デザイン規約 (ame-ui-philosophy & ame-ui-typography) の紹介およびインタラクティブデモWebページ"
    />

    <!-- Google Fonts as mandated by ame-ui-typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- 初回描画の FOUC 防止: 描画前に保存済みテーマを .dark クラスへ適用する。
         Tailwind v4 は dark: バリアントを .dark クラス連動で切替える（index.css の
         @custom-variant dark 参照）。SettingsContext の useEffect 適用前にクラスを
         付与することで、OS ダーク設定ユーザーへのライト背景フラッシュを防ぐ。 -->
    <script>
      (function () {
        var settings = {};
        try {
          settings = JSON.parse(localStorage.getItem("app_settings") || "{}") || {};
        } catch {
          /* 保存値が壊れている場合は既定（system）で描画する */
        }
        var mode = settings.themeMode || "system";
        var isDark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body
    class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 ease-out min-h-screen"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
